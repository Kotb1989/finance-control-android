<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Control | إدارة العهد والصرف</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">FC</div><div><b>Finance Control</b><small>إدارة العهد والصرف</small></div></div>
    <div class="company-switch"><small>الشركة الحالية</small><select id="companyFilter"><option value="all">كل شركات المجموعة</option><option>الشركة العقارية القابضة</option><option>شركة مشروع النخيل</option><option>شركة التطوير العمراني</option></select></div>
    <nav>
      <button class="nav active" data-page="dashboard">▦ <span>لوحة التحكم</span></button>
      <button class="nav" data-page="advances">▣ <span>إدارة العهد</span></button>
      <button class="nav" data-page="vouchers">▤ <span>سندات الصرف</span></button>
      <button class="nav" data-page="settlements">✓ <span>تسويات العهد</span></button>
      <button class="nav" data-page="integration">⇄ <span>الربط المحاسبي</span></button>
      <button class="nav" data-page="reports">▥ <span>التقارير</span></button>
      <button class="nav" data-page="settings">⚙ <span>الإعدادات</span></button>
    </nav>
    <div class="sidefoot">الإصدار التجريبي 0.1<br><span>بيئة عرض توضيحية</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><small>نظام الإدارة المالية</small><h1 id="pageTitle">لوحة التحكم</h1></div><div class="top-actions"><span class="user">مدير النظام</span><button class="primary" id="quickAdd">＋ عملية جديدة</button></div></header>
    <section id="content"></section>
    <footer>Finance Control MVP · جميع البيانات المعروضة تجريبية ويمكن تعديلها داخل هذه النسخة.</footer>
  </main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">إضافة</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script src="app.js"></script>
</body></html>
